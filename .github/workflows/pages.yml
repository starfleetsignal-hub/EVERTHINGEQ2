name: Build site

# Rebuilds the site from content/ and publishes it to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
    paths: ["content/**", "data/**", "tools/**", "CNAME", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Web pictures"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Shrunk pictures (made by the "Web pictures" workflow) come from the images release; build_preview links the ones it finds
      - name: Get the pictures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download images -R "$GITHUB_REPOSITORY" -p 'web-pictures-*.tar' -D /tmp/pictures || echo "No pictures on the release yet"
          for f in /tmp/pictures/*.tar; do [ -f "$f" ] && tar -xf "$f"; done; ls images/w 2>/dev/null | wc -l
      - run: python3 tools/build_preview.py
      - run: |
          mkdir -p build/site/images && cp images/*.png build/site/images/
          if [ -d images/w ]; then cp -r images/w build/site/images/; fi
      # The custom domain lives in CNAME at the repo root; gh-pages is rebuilt from scratch, so copy it in each time
      - run: if [ -f CNAME ]; then cp CNAME build/site/CNAME; fi
      - name: Publish to gh-pages
        run: |
          cd build/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
