name: Images probe
# One-off: time the first files of shard 4 one by one to find what stalls.
on:
  push:
    branches: [main]
    paths: [".github/workflows/images-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: images-release.json
          sparse-checkout-cone-mode: false
      - run: |
          python3 - <<'PY'
          import json
          for i in [i for i in json.load(open("images-release.json")) if i["shard"] == 4][:150]: print(i["url"] + "?format=original")
          PY
          python3 - <<'PY' > urls.txt
          import json
          for i in [i for i in json.load(open("images-release.json")) if i["shard"] == 4][:150]: print(i["url"] + "?format=original")
          PY
          n=0; while read -r u; do n=$((n+1)); curl -4 -sS -o /dev/null --max-time 40 -A "NorrathLedgerImporter/0.1" -w "$n %{http_code} %{size_download}B %{time_connect}s %{time_starttransfer}s %{time_total}s\n" "$u" || echo "$n FAILED $u"; done < urls.txt
