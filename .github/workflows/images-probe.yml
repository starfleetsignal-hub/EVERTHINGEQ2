name: Images probe
# One-off check that Fandom's image host answers GitHub runners, and how fast.
on:
  push:
    branches: [main]
    paths: [".github/workflows/images-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            images-release.json
          sparse-checkout-cone-mode: false
      - run: time python3 tools/release_images.py --shard 0 --limit 400 && ls -la eq2-images-00.tar && head -c 600 eq2-images-00-failed.json
